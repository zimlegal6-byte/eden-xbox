name: Build Jadyx Xbox UWP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - build-42-graphics-updates-ptbr
    paths:
      - '.github/workflows/build-jadyx-xbox.yml'
      - 'src/**'
      - 'externals/**'
      - 'tools/xbox/**'
      - 'dist/uwp/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'CMakeModules/**'

permissions:
  contents: read

concurrency:
  group: jadyx-xbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package Jadyx
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show available build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          vswhere -latest -products '*' -property installationPath
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe")) {
            throw "vswhere.exe not found"
          }

      - name: Install native Perl and NASM
        shell: pwsh
        run: |
          choco install strawberryperl nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Perl/NASM" }
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
            throw "Strawberry Perl was not installed at the path expected by build-env.bat"
          }
          if (-not (Test-Path 'C:\Program Files\NASM\nasm.exe')) {
            $nasm = Get-ChildItem 'C:\Program Files' -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $nasm) { throw "NASM was not found after installation" }
            New-Item -ItemType Directory -Force 'C:\Program Files\NASM' | Out-Null
            Copy-Item $nasm.FullName 'C:\Program Files\NASM\nasm.exe' -Force
          }

      - name: Install glslangValidator
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'Jadyx-GitHub-Actions'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/KhronosGroup/glslang/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match 'windows.*Release.*zip|windows.*zip|Windows.*zip' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match 'windows' -and $_.name -match '\.zip$' } | Select-Object -First 1
          }
          if (-not $asset) { throw "No Windows ZIP asset found in the latest glslang release" }
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\glslang.zip"
          Expand-Archive "$env:RUNNER_TEMP\glslang.zip" "$env:RUNNER_TEMP\glslang" -Force
          $validator = Get-ChildItem "$env:RUNNER_TEMP\glslang" -Filter glslangValidator.exe -Recurse | Select-Object -First 1
          if (-not $validator) {
            $glslang = Get-ChildItem "$env:RUNNER_TEMP\glslang" -Filter glslang.exe -Recurse | Select-Object -First 1
            if (-not $glslang) { throw "glslangValidator.exe/glslang.exe missing from downloaded archive" }
            Copy-Item $glslang.FullName (Join-Path $glslang.DirectoryName 'glslangValidator.exe')
            $validator = Get-Item (Join-Path $glslang.DirectoryName 'glslangValidator.exe')
          }
          New-Item -ItemType Directory -Force 'C:\glslang\bin' | Out-Null
          Copy-Item $validator.FullName 'C:\glslang\bin\glslangValidator.exe' -Force
          "C:\glslang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & 'C:\glslang\bin\glslangValidator.exe' --version

      - name: Configure UWP build
        shell: pwsh
        run: |
          cmd.exe /d /c "tools\xbox\build-env.bat cmake --preset uwp-x64"
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed (exit $LASTEXITCODE)" }

      - name: Compile Jadyx for Xbox
        shell: pwsh
        run: |
          cmd.exe /d /c "tools\xbox\build-env.bat cmake --build --preset uwp-x64 --target jadyx --parallel 2"
          if ($LASTEXITCODE -ne 0) { throw "Jadyx compilation failed (exit $LASTEXITCODE)" }

      - name: Package and self-sign APPX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/xbox/package-appx.ps1 -Library
          if ($LASTEXITCODE -ne 0) { throw "APPX packaging/signing failed (exit $LASTEXITCODE)" }
          $package = 'build-uwp\package'
          Get-ChildItem $package -Recurse | Select-Object FullName, Length
          foreach ($required in @('jadyx.appx', 'jadyx.cer', 'Microsoft.VCLibs.x64.14.00.appx')) {
            if (-not (Test-Path (Join-Path $package $required))) {
              throw "Required Xbox install file missing: $required"
            }
          }

      - name: Upload Xbox install package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jadyx-xbox-uwp-${{ github.run_number }}
          path: |
            build-uwp/package/jadyx.appx
            build-uwp/package/jadyx.cer
            build-uwp/package/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jadyx-build-diagnostics-${{ github.run_number }}
          path: |
            build-uwp/CMakeCache.txt
            build-uwp/build.ninja
            build-uwp/package/**
          if-no-files-found: ignore
          retention-days: 7
